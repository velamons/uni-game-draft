<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>University Life</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#f5f5f5; }
    #game { max-width: 780px; margin: 24px auto; padding: 0 12px; }
    .card {
      background:#fff;
      padding:16px 20px;
      border-radius:10px;
      box-shadow:0 2px 6px rgba(0,0,0,0.08);
      margin-bottom:16px;
    }
    .stats { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:4px 16px; margin:8px 0; }
    .banner { margin:8px 0; font-style:italic; }
    .log { margin-top:8px; font-size:0.95rem; }
    button {
      margin-top:8px;
      padding:10px 14px;
      border-radius:8px;
      border:1px solid #ccc;
      cursor:pointer;
      background:#fff;
    }
    button:hover { background:#eee; }
    .choice-btn { display:block; width:100%; text-align:left; }
  </style>
</head>
<body>
  <div id="game"></div>
  <script src="game.js"></script>
</body>
</html>
